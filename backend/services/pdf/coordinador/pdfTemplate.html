<!DOCTYPE html>
<html>

<head>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            font-size: 12px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .field {
            margin-bottom: 10px;
        }

        .label {
            font-weight: bold;
        }

    </style>

</head>

<body>

    <h1>INFORME DE COORDINACIÓN</h1>

    <div class="field">
        <span class="label">Fecha:</span>
        {{fecha}}
    </div>

    <div class="field">
        <span class="label">Obra:</span>
        {{obra}}
    </div>

    <div class="field">
        <span class="label">Cliente:</span>
        {{cliente}}
    </div>

    <div class="field">
        <span class="label">Alcance:</span>
        {{alcance}}
    </div>

    <hr>

    <div class="field">
        <span class="label">Realizado por:</span>
        {{realizadoPor}}
    </div>

    <div class="field">
        <span class="label">Revisado por:</span>
        {{revisadoPor}}
    </div>

</body>

</html>
