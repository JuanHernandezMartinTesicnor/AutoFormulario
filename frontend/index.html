<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AutoFormulario</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >

</head>

<body>

    <!-- =========================
         CABECERA
    ========================== -->

    <header class="main-header">

        <div class="header-content">

            <a
                href="/"
                class="logo"
            >
                AutoFormulario
            </a>


            <nav
                id="navUsuario"
                class="nav-usuario"
            >

                <a
                    href="/login/"
                    class="btn-header"
                >
                    Iniciar sesión
                </a>

                <a
                    href="/registro/"
                    class="btn-header btn-registro"
                >
                    Registrarse
                </a>

            </nav>

        </div>

    </header>


    <!-- =========================
         CONTENIDO
    ========================== -->

    <main class="home-container">

        <section class="hero">

            <h1 class="main-title">
                Sistema de Formularios
            </h1>

            <p class="main-description">
                Selecciona el formulario o proyecto
                que quieres gestionar.
            </p>

        </section>


        <!-- =========================
             USUARIO
        ========================== -->

        <section
            id="usuarioPanel"
            class="usuario-panel"
            style="display: none;"
        >

            <span>
                Sesión iniciada como
                <strong id="usuarioNombre"></strong>
            </span>

            <div class="usuario-acciones">

                <a
                    id="btnGestion"
                    href="/gestion/"
                    class="btn-secundario"
                    style="display: none;"
                >
                    Gestión de proyectos
                </a>

                <button
                    id="btnCerrarSesion"
                    class="btn-cerrar"
                >
                    Cerrar sesión
                </button>

            </div>

        </section>


        <!-- =========================
             FORMULARIOS / PROYECTOS
        ========================== -->

        <section class="formularios-section">

            <h2>
                Formularios
            </h2>


            <div
                id="cardsContainer"
                class="cards-container"
            >

                <!--
                    Se rellenará desde app.js
                -->

            </div>


            <div
                id="mensaje"
                class="mensaje"
            ></div>

        </section>

    </main>


    <script
        type="module"
        src="/app.js"
    ></script>

</body>

</html>
