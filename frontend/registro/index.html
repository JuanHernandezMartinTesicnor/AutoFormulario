<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Registrarse - AutoFormulario</title>

    <link
        rel="stylesheet"
        href="/registro/style.css"
    >

</head>

<body>

    <main class="registro-container">

        <div class="registro-card">

            <div class="registro-header">

                <h1>
                    AutoFormulario
                </h1>

                <p>
                    Crear cuenta
                </p>

            </div>


            <form id="registroForm">

                <label for="nombre">
                    Nombre
                </label>

                <input
                    type="text"
                    id="nombre"
                    required
                >


                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    required
                >


                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    minlength="6"
                    required
                >


                <label for="passwordConfirmacion">
                    Repetir contraseña
                </label>

                <input
                    type="password"
                    id="passwordConfirmacion"
                    minlength="6"
                    required
                >


                <label>
                    Tipo de usuario
                </label>

                <div class="roles">

                    <label class="role-option">

                        <input
                            type="radio"
                            name="rol"
                            value="tecnico"
                            checked
                        >

                        Técnico

                    </label>


                    <label class="role-option">

                        <input
                            type="radio"
                            name="rol"
                            value="coordinador"
                        >

                        Coordinador

                    </label>

                </div>


                <div id="mensaje"></div>


                <button
                    type="submit"
                    class="btn-registro"
                >
                    Registrarse
                </button>


                <a
                    href="/login/"
                    class="volver-login"
                >
                    Ya tengo una cuenta
                </a>

            </form>

        </div>

    </main>


    <script
        type="module"
        src="/registro/app.js"
    ></script>

</body>

</html>
